<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sanchez:ital@0;1&amp;display=swap');
      .bg {
        fill: #0c0d0e;
      }
      .logo-text-bold-white {
        font-family: 'Sanchez', 'Rockwell', 'Georgia', serif;
        font-weight: 800;
        font-size: 88px;
        fill: #ffffff;
        letter-spacing: 0.28em;
        text-anchor: middle;
        stroke: #ffffff;
        stroke-width: 3.5px;
        stroke-linejoin: round;
        paint-order: stroke fill;
      }
      .one-line-white {
        fill: none;
        stroke: #ffffff;
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .accent-line-white {
        stroke: #ffffff;
        stroke-width: 3.5;
        stroke-linecap: round;
        opacity: 0.9;
      }
    </style>
  </defs>

  <!-- Deep Obsidian Black Background -->
  <rect width="800" height="800" class="bg" rx="20" />

  <!-- Continuous single line 'A' + Heart mark with tightened gap -->
  <g id="mark" transform="translate(400, 290)">
    <path class="one-line-white" d="
      M -75, 170
      L -2, -120
      C 40, -190 145, -135 145, -30
      C 145, 55 50, 125 0, 175
      C -50, 125 -145, 55 -145, -30
      C -145, -135 -40, -190 2, -120
      L 75, 170
      C 60, 130 50, 60 45, 55
      L -45, 55
    " />
  </g>

  <!-- Wordmark in bold Sanchez font with reduced gap -->
  <text x="412" y="565" class="logo-text-bold-white">AMOR</text>

  <!-- Minimal balanced divider -->
  <line x1="330" y1="605" x2="470" y2="605" class="accent-line-white" />
</svg>