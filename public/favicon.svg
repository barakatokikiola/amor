<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sanchez:ital@0;1&amp;display=swap');
      .logo-text-bold {
        font-family: 'Sanchez', 'Rockwell', 'Georgia', serif;
        font-weight: 800;
        font-size: 58px;
        fill: #000000;
        letter-spacing: 0.26em;
        text-anchor: middle;
        stroke: #000000;
        stroke-width: 1.5px;
        paint-order: stroke fill;
      }
      .one-line {
        fill: none;
        stroke: #000000;
        stroke-width: 5.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Mark directly resting on the AMOR text -->
  <g id="mark" transform="translate(250, 115) scale(0.48)">
    <path class="one-line" d="
      M -75, 170
      L -2, -120
      C 40, -190 145, -135 145, -30
      C 145, 55 50, 125 0, 175
      C -50, 125 -145, 55 -145, -30
      C -145, -135 -40, -190 2, -120
      L 75, 170
      C 60, 130 50, 60 45, 55
      L -45, 55
    " />
  </g>

  <!-- Wordmark in bold Sanchez font with the mark directly sitting atop the letters -->
  <text x="256" y="235" class="logo-text-bold">AMOR</text>
</svg>